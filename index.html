<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academische woordenschat – 3de graad D/A – Rood</title>
<meta name="description" content="Oefen 507 academische woorden en uitdrukkingen in 21 groepen met 16 interactieve werkvormen.">
<style>
:root{--bg:#fbf4f3;--card:#fff;--ink:#2b1a19;--mute:#7a6462;--line:#efdcd9;--acc:#b8212b;--acc2:#e04b45;--acc-ink:#fff;--soft:#fbe3e1;--ok:#1b7f45;--ok-s:#e0f3e7;--bad:#9b1c4a;--bad-s:#f9e1ea;--sh:0 1px 2px rgba(70,15,15,.06),0 6px 20px rgba(70,15,15,.06)}
html[data-theme=dark]{--bg:#1a1213;--card:#261b1c;--ink:#f5eceb;--mute:#b9a4a2;--line:#3e2c2d;--acc:#ff6b63;--acc2:#ff8f86;--acc-ink:#1d0b0b;--soft:#3e1d1e;--ok:#62d391;--ok-s:#1b3a29;--bad:#ff7fae;--bad-s:#46202f;--sh:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.top{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--acc-ink)}
.top-in{max-width:980px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0;text-decoration:none;color:inherit}
.brand b{display:block;font-size:1.15rem;line-height:1.2}
.brand span{font-size:.82rem;opacity:.9}
.pill{background:rgba(255,255,255,.22);border:0;border-radius:99px;padding:6px 12px;color:inherit;font-weight:600;white-space:nowrap}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:18px 16px 40px}
footer{color:var(--mute);font-size:.85rem;text-align:center;padding:16px}
footer button{background:none;border:0;color:var(--mute);text-decoration:underline;padding:4px}
h1{font-size:1.5rem;margin:.2em 0 .1em;line-height:1.2}
h2{font-size:1.02rem;margin:1.6em 0 .6em;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
p{margin:.4em 0}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:11px 18px;font-weight:650;min-height:44px}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.ghost{background:none;color:var(--mute);padding:8px 6px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g-tiles{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.g-modes{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;box-shadow:var(--sh);transition:transform .12s,border-color .12s;display:block;width:100%}
.tile:hover{transform:translateY(-2px);border-color:var(--acc2)}
.tile .L{font-size:1.7rem;font-weight:800;color:var(--acc);line-height:1}
.tile small{color:var(--mute);display:block}
.meter{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--acc2);border-radius:9px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.big .tile{padding:16px}
.big .tile b{font-size:1.05rem}
.mode b{display:block}
.mode .ic{font-size:1.4rem;float:right;margin-left:8px}
.badge{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--soft)}
.badge.full{background:var(--ok-s);color:var(--ok)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-t{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-n{color:var(--mute);font-variant-numeric:tabular-nums}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 6px}
.prompt{font-size:1.3rem;font-weight:650;line-height:1.35;margin-bottom:16px}
.prompt.s{font-size:1.12rem;font-weight:500}
.hint{color:var(--mute);font-size:.95rem;font-weight:400;margin-top:8px}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;min-height:48px;display:flex;gap:10px;align-items:baseline}
.opt kbd{font:inherit;font-size:.8rem;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.opt:not(:disabled):hover{border-color:var(--acc2)}
.opt.ok,.ok-b{border-color:var(--ok)!important;background:var(--ok-s)!important}
.opt.bad,.bad-b{border-color:var(--bad)!important;background:var(--bad-s)!important}
.opt.pick{border-color:var(--acc);background:var(--soft)}
.fb{margin-top:16px;border-radius:12px;padding:12px 14px;border-left:5px solid var(--line);background:var(--bg)}
.fb.ok{border-color:var(--ok);background:var(--ok-s)}
.fb.bad{border-color:var(--bad);background:var(--bad-s)}
.fb.warn{border-color:var(--acc2);background:var(--soft)}
.fb h4{margin:0 0 4px;font-size:1rem}
.fill{color:var(--acc);font-weight:700}
.gap{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--acc2);margin:0 3px;height:1.1em;vertical-align:baseline}
.gi{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;min-width:8em;max-width:100%;font-weight:600}
.gi.in{width:11em;margin:3px 2px}
.gi.wide{width:100%;font-size:1.1rem}
.gi:focus{border-color:var(--acc2);outline:0}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
/* flashcards */
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .wd{font-size:1.9rem;font-weight:800;color:var(--acc);overflow-wrap:anywhere}
/* lijst */
.wl{width:100%;border-collapse:collapse}
.wl td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
.wl td:first-child{font-weight:700;white-space:nowrap}
.wl .ex{color:var(--mute);font-style:italic;font-size:.93rem}
.star{background:none;border:0;font-size:1.25rem;line-height:1;color:var(--line);padding:4px}
.star.on{color:var(--acc2)}
@media(max-width:600px){.wl td:first-child{white-space:normal}.wl td{padding:8px 4px}}
/* verbinden */
.match{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px 14px}
.mi{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;min-height:54px;font-size:.95rem;overflow-wrap:anywhere}
.mi.w{font-weight:700}
.mi.sel{border-color:var(--acc);background:var(--soft)}
.mi.done{border-color:var(--ok);background:var(--ok-s);opacity:.75}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.mem{grid-template-columns:repeat(3,1fr);gap:7px}}
.mc{aspect-ratio:1/1;border-radius:12px;border:2px solid var(--line);background:linear-gradient(135deg,var(--acc),var(--acc2));color:transparent;padding:6px;font-size:.78rem;line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;overflow-wrap:anywhere}
.mc.w.up,.mc.w.done{font-size:.95rem;font-weight:800}
.mc.up,.mc.done{background:var(--card);color:var(--ink)}
.mc.done{border-color:var(--ok);background:var(--ok-s)}
@media(max-width:400px){.mc{font-size:.68rem}.mc.w.up,.mc.w.done{font-size:.8rem}}
/* woordbank */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:12px;border:2px dashed var(--line);border-radius:14px;min-height:60px}
.chip{background:var(--soft);border:2px solid transparent;border-radius:99px;padding:7px 14px;font-weight:650}
.chip:disabled{opacity:.3}
.gs{padding:12px 0;border-top:1px solid var(--line);line-height:2}
.gs:first-of-type{border-top:0}
.slot{display:inline-block;min-width:7em;min-height:2em;vertical-align:middle;border:2px dashed var(--acc2);border-radius:10px;background:none;padding:2px 10px;font-weight:700;margin:0 3px;line-height:1.5}
.slot.act{background:var(--soft);border-style:solid}
.slot.set{border-style:solid;border-color:var(--line)}
/* tegels (anagram) */
.tiles{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;justify-content:center;margin:10px 0}
.tiles.ans{border-bottom:3px solid var(--line);padding-bottom:10px}
.tl{width:42px;height:46px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:1.25rem;font-weight:800;text-transform:uppercase;padding:0}
.tiles.ans .tl{border-color:var(--acc2);background:var(--soft)}
@media(max-width:480px){.tl{width:34px;height:40px;font-size:1.05rem}}
/* galgje */
.hm{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.hm svg{width:130px;height:150px;stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round}
.hw{font-size:1.7rem;font-weight:800;letter-spacing:.22em;font-family:ui-monospace,Consolas,monospace;overflow-wrap:anywhere;text-align:center}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.kb button{width:38px;height:42px;border-radius:9px;border:2px solid var(--line);background:var(--card);font-weight:700;text-transform:uppercase;padding:0}
.kb button:disabled{opacity:.35}
/* kruiswoord */
.cw-wrap{overflow-x:auto;padding-bottom:6px}
.cw{display:grid;gap:2px;margin:0 auto;width:max-content}
.cc{width:30px;height:30px;position:relative}
.cc input{width:100%;height:100%;border:1.5px solid var(--mute);border-radius:4px;background:var(--card);text-align:center;font-weight:800;text-transform:uppercase;padding:0;font-size:1rem;caret-color:transparent}
.cc.hl input{background:var(--soft)}
.cc.cur input{border-color:var(--acc);border-width:2.5px;outline:0}
.cc.good input{background:var(--ok-s);border-color:var(--ok)}
.cc.wrong input{background:var(--bad-s);border-color:var(--bad)}
.cc sup{position:absolute;left:2px;top:0;font-size:.55rem;line-height:1.3;color:var(--mute);pointer-events:none;z-index:1}
@media(max-width:440px){.cc{width:25px;height:25px}.cc input{font-size:.85rem}}
.clues{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 20px;margin-top:14px}
.clues h3{margin:.4em 0 .2em;font-size:.95rem}
.clue{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 6px;border-radius:8px;font-size:.93rem}
.clue.on{background:var(--soft)}
.clue.good{color:var(--ok)}
/* race */
.clock{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
/* resultaat */
.res{text-align:center}
.ring{--p:0;width:140px;height:140px;border-radius:50%;margin:6px auto 10px;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring div{width:108px;height:108px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.9rem;font-weight:800}
.errs{text-align:left;margin-top:16px}
.errs li{margin:.5em 0}
.rev{width:100%;table-layout:fixed;border-collapse:collapse;text-align:left;font-size:.9rem;margin-top:12px;overflow-wrap:break-word;hyphens:auto}.rev th:first-child{width:1.6em}.rev th:nth-child(2){width:40%}.rev .gap{min-width:2.5em}
.rev td,.rev th{padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:10px 0}
.checks label{border:2px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-weight:600}
.daybox{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.daybox div{flex:1;min-width:120px;background:var(--bg);border-radius:12px;padding:10px 12px}.daybox b{display:block;font-size:1.5rem;color:var(--acc);line-height:1.2}
.tile.hero{border:2px solid var(--acc2);background:linear-gradient(135deg,var(--soft),var(--card))}
.lv{display:flex;gap:4px;margin-top:8px}.lv i{flex:1;height:8px;border-radius:4px;background:var(--line)}
select{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 10px}
@media print{.top,footer,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>

<main id="app"></main>

 document.","Het parlement diende een ... in om de wet aan te passen.",["amendement"]],["A","interdisciplinair","Betrekking hebbend op verschillende vakgebieden of disciplines.","Het onderzoeksproject had een ... team van biologen, chemici en fysici.",["interdisciplinair"]],["A","represaille","Een vergeldingsactie; een daad van wraak.","Als ... voor de aanval, voerde het leger een tegenaanval uit.",["represaille"]],["A","intoxicatie","Vergiftiging, vaak door alcohol of drugs.","Na het drinken van de onbekende vloeistof werd hij met een ... in het ziekenhuis opgenomen.",["intoxicatie"]],["A","exodus","Een massale uittocht van een volk.","De oorlog veroorzaakte een ... van vluchtelingen naar buurlanden.",["exodus"]],["A","imaginair","Niet echt bestaand, denkbeeldig.","Als kind had ze een ... vriendje met wie ze hele gesprekken voerde.",["imaginair"]],["A","onverdroten","Zonder ophouden, met onverminderde ijver.","Ze werkte ... door aan haar proefschrift, zelfs in het weekend.",["onverdroten"]],["A","islamofobie","Angst voor of haat tegen de islam of moslims.","De politieke partij werd beschuldigd van het aanwakkeren van ....",["islamofobie"]],["A","prenataal","Voor de geboorte.","... onderzoek kan eventuele afwijkingen bij de ongeboren vrucht opsporen.",["prenataal"]],["A","clusteren","Groeperen, samenbrengen in een cluster.","De data werd geanalyseerd door vergelijkbare resultaten te ....",["clusteren"]],["A","substantieel","Aanzienlijk, wezenlijk, belangrijk in omvang.","Het nieuwe contract betekende een ... salarisverhoging.",["substantieel"]],["A","tanen","Afzwakken, verminderen in kracht of glans.","Na zijn pensionering begon zijn invloed langzaam te ....",["tanen"]],["B","respondent","Iemand die antwoordt op een enquête of vragenlijst.","Van de 1000 aangeschreven personen, stuurden 350 ... de enquête terug.",["respondenten"]],["B","kitsch","Smakeloze, sentimentele kunst of voorwerpen.","Haar huis stond vol met ... zoals porseleinen beeldjes en schilderijen van h   if(key==='HARD'&&!idx.length){app.innerHTML=h+'<div class="card"><p>Je lijst is leeg. Woorden waarbij je een fout maakt of die je met een ster markeert, komen hier terecht. Beantwoord je ze daarna twee keer juist, dan verdwijnen ze weer.</p></div>';return}
  h+='<p class="mute">'+(key==='ALL'?'Bij elke oefening krijg je 25 nieuwe willekeurige woorden.':key==='EXPR'?idx.length+' uitdrukkingen, spreekwoorden, vaste verbindingen en Latijnse termen uit alle groepen.':idx.length+(idx.length===1?' woord':' woorden')+(GROUPS.includes(key)?' · voortgang '+groupPct(key)+'%':''))+'</p>'+
  '<p class="row"><label for="nq">Aantal vragen per oefening:</label><select id="nq">'+[10,15,25].map(n=>'<option'+(S.n===n?' selected':'')+'>'+n+'</option>').join('')+'</select></p>';
  let ph='';const ms=MODES.filter(m=>modeFor(m,key));if(key==='EXPR')ms.unshift(ms.pop());for(const m of ms){if(m.p!==ph){if(ph)h+='</div>';ph=m.p;h+='<h2>'+ph+'</h2><div class="grid g-modes">'}
    const v=b[m.id];const bd=v==null?'':m.sc===2?'<span class="badge">record: '+v+' punten</span>':'<span class="badge'+(v>=100?' full':'')+'">beste: '+v+'%</span>';
    h+='<button class="tile mode" data-go="#/g/'+key+'/'+m.id+'"><span class="ic" aria-hidden="true">'+m.ic+'</span><b>'+m.n+'</b><small>'+m.d+'</small>'+(m.sc?bd:'')+'</button>'}
  app.innerHTML=h+'</div>';$('#nq').onchange=e=>{S.n=+e.target.value;save()}}

function start(mode,idx){const m=MODES.find(x=>x.id===mode);CUR.mode=mode;if(cleanup){cleanup();cleanup=null}keyH=null;
  idx=idx||(mode==='list'&&CUR.key==='ALL'?W.map(w=>w.i):poolIdx(CUR.key));
  if(idx.length<m.min){app.innerHTML=head(m.n)+'<div class="card"><p>Voor deze werkvorm zijn minstens '+m.min+' woorden nodig. Er '+(idx.length===1?'is er nu 1':'zijn er nu '+idx.length)+'.</p></div>';return}
  const title=m.n+' · '+poolLabel(CUR.key);
  ({flash:mFlash,list:mList,mc1:i=>mQuiz(mode,title,i,qMc1),mc2:i=>mQuiz(mode,title,i,qMc2),tf:i=>mQuiz(mode,title,i,qTf),gaptype:i=>mQuiz(mode,title,i,qGapT),typeword:i=>mQuiz(mode,title,i,qType),
    match:mMatch,memory:mMemory,gapbank:mBank,cross:mCross,anagram:mAnagram,hangman:mHangman,race:mRace,
    expr:i=>{const cyc=[qExprMean,qKey,qExprGap];let n=0;mQuiz(mode,title,i,(w,pool)=>cyc[n++%3](w,pool))}})[mode](idx,title)}

/* ---------- resultaat ---------- */
function finish(mode,title,score,total,bad,opt){opt=opt||{};const pct=opt.pct!=null?opt.pct:total?Math.round(score/total*100):0;touchStreak();
  if(!opt.nosave)saveBest(CUR.key,mode,opt.raw!=null?opt.raw:pct);
  bad=[...new Set(bad||[])];
  const msg=opt.msg||(pct>=100?'Perfect! Je beheerst deze woorden.':pct>=80?'Sterk gedaan, bijna alles juist.':pct>=50?'Goed bezig. Herhaal je fouten en probeer opnieuw.':'Nog even oefenen: begin met de flashcards.');
  app.innerHTML=head(title)+'<section class="card res"><div class="ring" style="--p:'+pct+'"><div>'+(opt.center||pct+'%')+'</div></div><h1>'+(opt.line||score+' van de '+total+' juist')+'</h1><p class="mute">'+msg+'</p>'+
  '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="again">Opnieuw</button>'+(bad.length&&REDO.includes(mode)?'<button class="btn sec" id="redo">Oefen mijn fouten ('+bad.length+')</button>':'')+'<button class="btn sec" data-go="#/g/'+CUR.key+'">Andere werkvorm</button></div>'+
  (bad.length?'<div class="errs"><h2>Nog eens bekijken</h2><ul>'+bad.map(i=>'<li>'+explain(W[i])+'</li>').join('')+'</ul></div>':'')+'</section>';
  $('#again').onclick=opt.again||(()=>start(mode));if(opt.again)$('#again').textContent=opt.againT||'Opnieuw';if(opt.back)$$('[data-go="#/g/'+CUR.key+'"]',app).forEach(b=>{b.dataset.go=opt.back;if(!b.classList.contains('ghost'))b.textContent=opt.backT||'Naar het overzicht'});if($('#redo'))$('#redo').onclick=()=>start(mode,bad)}

/* ---------- quiz-motor (meerkeuze, waar/niet waar, typen, toets) ---------- */
function mQuiz(mode,title,idx,make){const pool=idx,qs=sample(idx,Math.min(S.n,idx.length)).map(i=>make(W[i],pool));runQuiz({title,qs,onDone:(score,log)=>finish(mode,title,score,qs.length,log.filter(l=>!l.ok).map(l=>l.q.w.i))})}
function runQuiz({title,qs,defer,back,onDone}){let k=0,score=0;const log=[];
  function show(){const q=qs[k];let tried=false,locked=false;
    app.innerHTML=head(title,k,qs.length,back)+'<section class="card"><p class="lbl">'+q.lbl+'</p><div class="prompt '+q.cls+'">'+q.prompt+'</div><div id="ans"></div><div id="fb" aria-live="polite"></div></section>';
    const fb=$('#fb'),box=$('#ans');
    function done(ok,given,note){locked=true;log.push({q,ok,given});if(ok){score++;right(q.w.i)}else wrong(q.w.i);
      if(defer)return next();
      fb.innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><h4>'+(ok?'Juist!':'Niet juist')+(note?' <span class="mute" style="font-weight:400">'+note+'</span>':'')+'</h4>'+explain(q.w)+'</div><p style="margin-top:14px"><button class="btn" id="nx">'+(k<qs.length-1?'Volgende':'Bekijk resultaat')+' →</button></p>';
      $('#nx').onclick=next;$('#nx').focus()}
    function next(){k++;if(k<qs.length)show();else onDone(score,log)}
    if(q.type==='choice'){box.innerHTML='<div class="opts">'+q.opts.map((o,i)=>'<button class="opt" data-i="'+i+'"><kbd>'+(i+1)+'</kbd><span>'+esc(o)+'</span></button>').join('')+'</div>';
      const pick=i=>{if(locked)return;const bs=$$('.opt',box);bs.forEach(b=>b.disabled=true);if(!defer){bs[q.correct].classList.add('ok');if(i!==q.correct)bs[i].classList.add('bad')}done(i===q.correct,q.opts[i])};
      box.onclick=e=>{const b=e.target.closest('.opt');if(b)pick(+b.dataset.i)};
      keyH=e=>{if(locked)return;const n=+e.key;if(n>=1&&n<=q.opts.length){e.preventDefault();pick(n-1)}}}
    else{box.innerHTML='<p><button class="btn" id="ck">Controleer</button></p>';const ins=$$('.gi',app);
      const sub=()=>{if(locked)return;const v=ins.map(i=>i.value);if(v.some(x=>!x.trim())){ins.find(i=>!i.value.trim()).focus();return}
        const r=q.check(v);if(!r.ok&&r.retry&&!tried&&!defer){tried=true;fb.innerHTML='<div class="fb warn"><h4>Bijna!</h4>Het juiste woord, maar de vorm past nog niet in deze zin. Probeer opnieuw.</div>';ins[0].focus();ins[0].select();return}
        ins.forEach(i=>{i.disabled=true;if(!defer)i.classList.add(r.ok?'ok-b':'bad-b')});$('#ck').remove();done(r.ok,v.join(' … '),r.note)};
      $('#ck').onclick=sub;ins.forEach(i=>i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();sub()}});ins[0].focus()}}
  show()}

/* ---------- flashcards ---------- */
function mFlash(idx,title){let deck=shuffle(idx),known=0;const total=deck.length;
  function show(){if(!deck.length){touchStreak();app.innerHTML=head(title)+'<section class="card res"><h1>Stapel afgewerkt</h1><p class="mute">Je hebt alle '+total+' kaarten gehad. Test jezelf nu met een andere werkvorm.</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="again">Opnieuw</button><button class="btn sec" data-go="#/g/'+CUR.key+'">Andere werkvorm</button></div></section>';$('#again').onclick=()=>start('flash');keyH=null;return}
    const w=W[deck[0]];let open=false;
    app.innerHTML=head(title,known,total)+'<section class="card flash" id="fc" tabindex="0" role="button" aria-label="Draai de kaart om"><div id="fcb"><div class="wd">'+esc(w.w)+'</div><p class="mute">Tik om de betekenis te zien</p></div></section><div class="row" style="justify-content:center;margin-top:14px" id="fcx"></div>';
    const flip=()=>{if(open)return;open=true;$('#fcb').innerHTML='<div class="wd">'+esc(w.w)+'</div><p style="font-size:1.15rem">'+esc(w.d)+'</p><p class="mute"><i>'+filled(w)+'</i></p>';
      $('#fcx').innerHTML='<button class="btn sec" id="no">Nog niet ✗</button><button class="btn" id="yes">Ken ik ✓</button>';
      $('#no').onclick=()=>{wrong(w.i);deck.push(deck.shift());show()};$('#yes').onclick=()=>{right(w.i);deck.shift();known++;show()}};
    $('#fc').onclick=flip;keyH=e=>{if(e.key===' '||e.key==='Enter'){if(!open){e.preventDefault();flip()}}else if(open&&e.key==='ArrowRight')$('#yes').click();else if(open&&e.key==='ArrowLeft')$('#no').click()}}
  show()}

/* ---------- woordenlijst ---------- */
function mList(idx,title){app.innerHTML=head(title)+'<p><input class="gi wide" id="zoek" type="search" placeholder="Zoek een woord of betekenis…" aria-label="Zoeken"></p><p class="mute" id="cnt"></p><div class="card" style="padding:6px 12px"><table class="wl"><tbody id="tb"></tbody></table></div>';
  const tb=$('#tb');function draw(){const q=strip($('#zoek').value);const rows=idx.map(i=>W[i]).filter(w=>!q||strip(w.w).includes(q)||strip(w.d).includes(q)).sort((a,b)=>a.w.localeCompare(b.w,'nl'));
    $('#cnt').textContent=rows.length+(rows.length===1?' woord':' woorden')+' · tik op de ster om een woord bij je moeilijke woorden te zetten';
    tb.innerHTML=rows.map(w=>'<tr><td>'+esc(w.w)+'</td><td>'+esc(w.d)+'<div class="ex">'+filled(w)+'</div></td><td><button class="star'+(S.hard[w.i]?' on':'')+'" data-i="'+w.i+'" aria-label="Markeer '+esc(w.w)+' als moeilijk" aria-pressed="'+!!S.hard[w.i]+'">★</button></td></tr>').join('')}
  $('#zoek').oninput=draw;tb.onclick=e=>{const b=e.target.closest('.star');if(!b)return;const i=+b.dataset.i;if(S.hard[i])delete S.hard[i];else S.hard[i]=2;save();b.classList.toggle('on',!!S.hard[i]);b.setAttribute('aria-pressed',!!S.hard[i])};draw()}

/* ---------- verbinden ---------- */
function mMatch(idx,title){const per=5,all=sample(idx,Math.min(idx.length,Math.max(per,Math.floor(Math.min(S.n,15)/per)*per)));let done=0,miss=0;const bad=[];
  function round(){const set=all.slice(done,done+per);if(!set.length)return finish('match',title,all.length,all.length+miss,bad,{pct:Math.round(all.length/(all.length+miss)*100),line:all.length+' paren, '+miss+(miss===1?' misser':' missers')});
    let selW=null,selD=null,left=set.length;
    app.innerHTML=head(title,done,all.length)+'<p class="mute">Tik op een woord en daarna op de juiste betekenis.</p><div class="match">'+(()=>{const ws=shuffle(set),ds=shuffle(set);return ws.map((w,r)=>'<button class="mi w" data-w="'+w+'">'+esc(W[w].w)+'</button><button class="mi d" data-d="'+ds[r]+'">'+esc(W[ds[r]].d)+'</button>').join('')})()+'</div>';
    $('.match').onclick=e=>{const b=e.target.closest('.mi');if(!b||b.classList.contains('done'))return;
      if(b.dataset.w){if(selW)selW.classList.remove('sel');selW=b}else{if(selD)selD.classList.remove('sel');selD=b}b.classList.add('sel');
      if(selW&&selD){const a=selW,c=selD;selW=selD=null;a.classList.remove('sel');c.classList.remove('sel');
        if(a.dataset.w===c.dataset.d||W[a.dataset.w].d===W[c.dataset.d].d){a.classList.add('done');c.classList.add('done');a.disabled=c.disabled=true;right(+a.dataset.w);left--;if(!left){done+=set.length;setTimeout(round,500)}}
        else{miss++;bad.push(+a.dataset.w);wrong(+a.dataset.w);[a,c].forEach(x=>{x.classList.add('shake','bad-b');setTimeout(()=>x.classList.remove('shake','bad-b'),450)})}}}}
  round()}

/* ---------- memory ---------- */
function mMemory(idx,title){const n=Math.min(6,idx.length),set=sample(idx,n);const cards=shuffle(set.flatMap(i=>[{i,t:'w'},{i,t:'d'}]));let open=[],moves=0,found=0,lock=false;
  app.innerHTML=head(title)+'<p class="mute">Zoek telkens het woord en zijn betekenis. Beurten: <b id="mv">0</b></p><div class="mem">'+cards.map((c,k)=>'<button class="mc '+c.t+'" data-k="'+k+'" aria-label="Kaart '+(k+1)+'">'+esc(c.t==='w'?W[c.i].w:W[c.i].d)+'</button>').join('')+'</div>';
  $('.mem').onclick=e=>{const b=e.target.closest('.mc');if(!b||lock||b.classList.contains('up')||b.classList.contains('done'))return;b.classList.add('up');b.setAttribute('aria-label',b.textContent);open.push(b);
    if(open.length===2){moves++;$('#mv').textContent=moves;const [a,c]=open.map(x=>cards[+x.dataset.k]);
      if(a.i===c.i&&a.t!==c.t){open.forEach(x=>{x.classList.remove('up');x.classList.add('done')});open=[];found++;
        if(found===n)setTimeout(()=>finish('memory',title,n,n,[],{pct:Math.max(40,100-Math.max(0,moves-n-4)*5),line:'Alle paren gevonden in '+moves+' beurten',msg:'Hoe minder beurten, hoe hoger je score.'}),600)}
      else{lock=true;setTimeout(()=>{open.forEach(x=>x.classList.remove('up'));open=[];lock=false},1300)}}}}

/* ---------- invullen met woordbank ---------- */
function mBank(idx,title){const per=Math.min(5,idx.length),all=sample(idx,Math.min(idx.length,Math.max(per,Math.floor(S.n/per)*per)));let done=0,score=0;const bad=[];
  function round(){const set=all.slice(done,done+per);if(!set.length)return finish('gapbank',title,score,all.length,bad);
    const extra=others(W[set[0]],idx.filter(i=>!set.includes(i)),1).filter(o=>!set.includes(o.i)).map(o=>o.i);const bank=shuffle(set.concat(extra));const fill=set.map(()=>null);let act=0,checked=false;
    app.innerHTML=head(title,done,all.length)+'<section class="card"><p class="lbl">Tik op een woord om het in het gemarkeerde vak te zetten. Er is één woord te veel.</p><div class="bank">'+bank.map(i=>'<button class="chip" data-i="'+i+'">'+esc(W[i].w)+'</button>').join('')+'</div><div id="gs">'+
      set.map((i,r)=>{const p=W[i].s.split('...');return '<div class="gs" data-r="'+r+'">'+esc(p[0])+'<button class="slot" data-r="'+r+'" aria-label="Invulvak '+(r+1)+'"></button>'+p.slice(1).map(esc).join(' … ')+'</div>'}).join('')+'</div><p style="margin-top:14px"><button class="btn" id="ck">Controleer</button></p></section>';
    const paint=()=>{$$('.slot').forEach((s,r)=>{s.textContent=fill[r]==null?'':W[fill[r]].w;s.classList.toggle('act',r===act&&!checked);s.classList.toggle('set',fill[r]!=null)});$$('.chip').forEach(c=>c.disabled=checked||fill.includes(+c.dataset.i))};
    const nextEmpty=()=>{const e=fill.findIndex(x=>x==null);act=e<0?-1:e};
    $('.bank').onclick=e=>{const c=e.target.closest('.chip');if(!c||checked||c.disabled)return;if(act<0)return;fill[act]=+c.dataset.i;nextEmpty();paint()};
    $('#gs').onclick=e=>{const s=e.target.closest('.slot');if(!s||checked)return;const r=+s.dataset.r;fill[r]=null;act=r;paint()};
    $('#ck').onclick=()=>{if(checked){done+=set.length;return round()}checked=true;
      set.forEach((i,r)=>{const ok=fill[r]!=null&&(fill[r]===i||W[fill[r]].w===W[i].w);if(ok){score++;right(i)}else{bad.push(i);wrong(i)}
        const row=$('.gs[data-r="'+r+'"]');row.innerHTML=(ok?'✓ ':'✗ ')+filled(W[i])+(ok?'':' <span class="mute">(jij koos: '+(fill[r]==null?'niets':esc(W[fill[r]].w))+')</span>');row.style.color=ok?'var(--ok)':'var(--bad)'});
      paint();$('#ck').textContent=(done+set.length<all.length?'Volgende reeks':'Bekijk resultaat')+' →'};
    paint()}
  round()}

/* ---------- anagram ---------- */
function mAnagram(idx,title){const c=idx.filter(i=>single(W[i])&&W[i].w.length>=4);const set=sample(c.length?c:idx,Math.min(c.length||idx.length,Math.min(S.n,10)));let k=0,score=0;const bad=[];
  function show(){if(k>=set.length)return finish('anagram',title,score,set.length,bad);const w=W[set[k]],L=[...w.w.toLowerCase()];let mix=shuffle(L),t=0;while(mix.join('')===L.join('')&&t++<20)mix=shuffle(L);
    let pool=mix.map((ch,i)=>({ch,i})),out=[],failed=false,over=false;
    app.innerHTML=head(title,k,set.length)+'<section class="card"><p class="lbl">Vorm het woord met deze betekenis</p><div class="prompt s">'+esc(w.d)+'</div><div class="tiles ans" id="out" aria-label="Jouw antwoord"></div><div class="tiles" id="pool"></div><div id="fb" aria-live="polite"></div><p class="row" style="margin-top:12px"><button class="btn sec" id="clr">Wis</button><button class="btn ghost" id="giveup">Toon oplossing</button></p></section>';
    const paint=()=>{$('#out').innerHTML=out.map((t,i)=>'<button class="tl" data-o="'+i+'">'+esc(t.ch)+'</button>').join('');$('#pool').innerHTML=pool.map((t,i)=>'<button class="tl" data-p="'+i+'">'+esc(t.ch)+'</button>').join('')};
    const end=ok=>{over=true;if(ok&&!failed){score++;right(w.i)}else{bad.push(w.i);wrong(w.i)}$('#pool').innerHTML='';$('#out').innerHTML=L.map(ch=>'<button class="tl" disabled>'+esc(ch)+'</button>').join('');
      $('#fb').innerHTML='<div class="fb '+(ok&&!failed?'ok':ok?'warn':'bad')+'"><h4>'+(ok?(failed?'Gevonden, na een foute poging':'Juist!'):'De oplossing')+'</h4>'+explain(w)+'</div><p style="margin-top:14px"><button class="btn" id="nx">Volgende →</button></p>';$('#clr').remove();$('#giveup').remove();$('#nx').onclick=()=>{k++;show()};$('#nx').focus()};
    const test=()=>{if(pool.length)return;if(out.map(t=>t.ch).join('')===L.join(''))end(true);else{failed=true;$('#out').classList.add('shake');setTimeout(()=>{const o=$('#out');if(o)o.classList.remove('shake')},400)}};
    $('#pool').onclick=e=>{const b=e.target.closest('[data-p]');if(!b||over)return;out.push(pool.splice(+b.dataset.p,1)[0]);paint();test()};
    $('#out').onclick=e=>{const b=e.target.closest('[data-o]');if(!b||over)return;pool.push(out.splice(+b.dataset.o,1)[0]);paint()};
    $('#clr').onclick=()=>{pool=pool.concat(out);out=[];paint()};$('#giveup').onclick=()=>{failed=true;end(false)};
    keyH=e=>{if(over||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Backspace'&&out.length){e.preventDefault();pool.push(out.pop());paint()}else if(e.key.length===1){const j=pool.findIndex(t=>strip(t.ch)===strip(e.key));if(j>=0){out.push(pool.splice(j,1)[0]);paint();test()}}};
    paint()}
  show()}

/* ---------- galgje ---------- */
const HM=['<path d="M10 145h90"/>','<path d="M30 145V10"/>','<path d="M30 10h55"/>','<path d="M85 10v20"/>','<circle cx="85" cy="42" r="12"/>','<path d="M85 54v40"/>','<path d="M85 66l-16 16M85 66l16 16M85 94l-14 22M85 94l14 22"/>'];
function mHangman(idx,title){const c=idx.filter(i=>!/\s/.test(W[i].w));const set=sample(c.length?c:idx,Math.min(c.length||idx.length,Math.min(S.n,8)));let k=0,score=0;const bad=[];
  function show(){if(k>=set.length)return finish('hangman',title,score,set.length,bad);const w=W[set[k]],chars=[...w.w];const used=new Set();let miss=0,over=false;
    app.innerHTML=head(title,k,set.length)+'<section class="card"><p class="lbl">Raad het woord</p><div class="prompt s">'+esc(w.d)+'</div><div class="hm"><svg viewBox="0 0 110 150" id="hs" role="img"></svg><div><div class="hw" id="hw"></div><p class="mute" id="hl" style="text-align:center"></p></div></div><div class="kb" id="kb">'+'abcdefghijklmnopqrstuvwxyz'.split('').map(l=>'<button data-l="'+l+'">'+l+'</button>').join('')+'</div><div id="fb" aria-live="polite"></div></section>';
    const isL=ch=>/[a-z]/.test(strip(ch));
    const paint=()=>{$('#hw').textContent=chars.map(ch=>!isL(ch)||used.has(strip(ch))||over?ch:'_').join('');$('#hs').innerHTML=HM.slice(0,miss).join('');$('#hs').setAttribute('aria-label',miss+' van de 7 fouten');$('#hl').textContent='Nog '+(7-miss)+(7-miss===1?' fout':' fouten')+' toegestaan'};
    const end=ok=>{over=true;if(ok){score++;right(w.i)}else{bad.push(w.i);wrong(w.i)}paint();$('#kb').remove();$('#fb').innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><h4>'+(ok?'Geraden!':'Niet geraden')+'</h4>'+explain(w)+'</div><p style="margin-top:14px"><button class="btn" id="nx">Volgende →</button></p>';$('#nx').onclick=()=>{k++;show()};$('#nx').focus()};
    const guess=l=>{if(over||used.has(l))return;used.add(l);const b=$('#kb [data-l="'+l+'"]');b.disabled=true;if(chars.some(ch=>strip(ch)===l)){b.classList.add('ok-b');paint();if(chars.every(ch=>!isL(ch)||used.has(strip(ch))))end(true)}else{b.classList.add('bad-b');miss++;paint();if(miss>=7)end(false)}};
    $('#kb').onclick=e=>{const b=e.target.closest('[data-l]');if(b)guess(b.dataset.l)};keyH=e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const l=strip(e.key);if(/^[a-z]$/.test(l))guess(l)};paint()}
  show()}

/* ---------- tijdsrace ---------- */
function mRace(idx,title){let t=60,pts=0,streak=0,n=0,ok=0,lock=false,q=null,last=-1;const bad=[];
  app.innerHTML=head(title)+'<section class="card"><div class="row" style="justify-content:space-between"><span class="clock" id="ck">60</span><span>Reeks: <b id="st">0</b></span><span>Punten: <b id="pt">0</b></span></div><div class="prog" style="margin-top:10px"><i id="tb" style="width:100%"></i></div><p class="lbl">Welk woord past bij deze betekenis?</p><div class="prompt s" id="rq"></div><div class="opts" id="ro"></div></section>';
  const next=()=>{if(!$('#rq'))return;let i;do{i=idx[Math.random()*idx.length|0]}while(i===last&&idx.length>1);last=i;q=qMc2(W[i],idx);lock=false;$('#rq').textContent=q.w.d;$('#ro').innerHTML=q.opts.map((o,j)=>'<button class="opt" data-i="'+j+'"><kbd>'+(j+1)+'</kbd><span>'+esc(o)+'</span></button>').join('')};
  const pick=j=>{if(lock||t<=0)return;lock=true;n++;const bs=$$('#ro .opt');bs[q.correct].classList.add('ok');
    if(j===q.correct){ok++;pts+=10+Math.min(streak,5)*2;streak++;right(q.w.i);setTimeout(()=>{if(t>0)next()},220)}else{bs[j].classList.add('bad');streak=0;bad.push(q.w.i);wrong(q.w.i);setTimeout(()=>{if(t>0)next()},1300)}
    $('#pt').textContent=pts;$('#st').textContent=streak};
  $('#ro').onclick=e=>{const b=e.target.closest('.opt');if(b)pick(+b.dataset.i)};keyH=e=>{const k=+e.key;if(k>=1&&k<=4)pick(k-1)};
  const iv=setInterval(()=>{t--;const c=$('#ck');if(!c)return;c.textContent=t;c.classList.toggle('low',t<=10);$('#tb').style.width=(t/60*100)+'%';
    if(t<=0){clearInterval(iv);cleanup=null;const prev=(S.best[CUR.key]||{}).race||0;finish('race',title,ok,n,bad,{raw:pts,pct:n?Math.round(ok/n*100):0,center:pts,line:pts+' punten · '+ok+' van de '+n+' juist',msg:pts>prev?'Nieuw record!':'Je record is '+prev+' punten. Een reeks juiste antwoorden levert bonuspunten op.'})}},1000);
  cleanup=()=>clearInterval(iv);next()}

/* ---------- kruiswoordraadsel ---------- */
function genCross(words,target,MAXC,MAXR){let best=null;
  for(let t=0;t<60;t++){const order=t===0?words.slice().sort((a,b)=>b.L.length-a.L.length):shuffle(words);const cells=new Map(),placed=[];let b={r0:0,r1:0,c0:0,c1:0};
    const get=(r,c)=>cells.get(r+','+c);
    const fits=(L,r,c,d)=>{const dr=d?1:0,dc=d?0:1,n=L.length;if(get(r-dr,c-dc)||get(r+dr*n,c+dc*n))return -1;let x=0;
      for(let k=0;k<n;k++){const rr=r+dr*k,cc=c+dc*k,e=get(rr,cc);if(e){if(e.ch!==L[k]||e.d[d])return -1;x++}else if(get(rr+dc,cc+dr)||get(rr-dc,cc-dr))return -1}
      const r2=r+dr*(n-1),c2=c+dc*(n-1);if(Math.max(b.c1,c2)-Math.min(b.c0,c)+1>MAXC||Math.max(b.r1,r2)-Math.min(b.r0,r)+1>MAXR)return -1;return x};
    const put=(w,r,c,d)=>{const dr=d?1:0,dc=d?0:1;for(let k=0;k<w.L.length;k++){const key=(r+dr*k)+','+(c+dc*k);let e=cells.get(key);if(!e){e={ch:w.L[k],d:[false,false],r:r+dr*k,c:c+dc*k};cells.set(key,e)}e.d[d]=true}
      b={r0:Math.min(b.r0,r),c0:Math.min(b.c0,c),r1:Math.max(b.r1,r+dr*(w.L.length-1)),c1:Math.max(b.c1,c+dc*(w.L.length-1))};placed.push({w,r,c,d})};
    const first=order.find(w=>w.L.length<=MAXC);if(!first)break;put(first,0,0,0);b={r0:0,r1:0,c0:0,c1:first.L.length-1};
    let prog=true;while(prog&&placed.length<target){prog=false;for(const w of order){if(placed.length>=target)break;if(placed.some(p=>p.w===w))continue;let bp=null;
      for(const e of [...cells.values()])for(let k=0;k<w.L.length;k++){if(w.L[k]!==e.ch)continue;for(let d=0;d<2;d++){if(e.d[d])continue;const r=e.r-(d?k:0),c=e.c-(d?0:k),x=fits(w.L,r,c,d);if(x>0&&(!bp||x>bp.x))bp={r,c,d,x}}}
      if(bp){put(w,bp.r,bp.c,bp.d);prog=true}}}
    if(!best||placed.length>best.placed.length)best={placed,b};if(best.placed.length>=target)break}
  if(!best)return null;const {placed,b}=best;placed.forEach(p=>{p.r-=b.r0;p.c-=b.c0});return{placed,rows:b.r1-b.r0+1,cols:b.c1-b.c0+1}}

function mCross(idx,title){const narrow=window.innerWidth<440;const MAXC=narrow?12:14;
  const cand=idx.map(i=>W[i]).filter(w=>!/\s/.test(w.w)).map(w=>({i:w.i,L:letters(w.w)})).filter(w=>w.L.length>=3&&w.L.length<=MAXC);
  const cw=cand.length>=2?genCross(cand,Math.min(10,cand.length),MAXC,16):null;
  if(!cw||cw.placed.length<2){app.innerHTML=head(title)+'<div class="card"><p>Met deze woorden kan geen kruiswoordraadsel gemaakt worden. Kies een groep of “Alles gemengd”.</p></div>';return}
  const P=cw.placed;P.sort((a,b)=>a.r-b.r||a.c-b.c);let num=0;const nums={};P.forEach(p=>{const k=p.r+','+p.c;if(!nums[k])nums[k]=++num;p.num=nums[k];p.cells=[...p.w.L].map((ch,j)=>({r:p.r+(p.d?j:0),c:p.c+(p.d?0:j),ch}));p.hint=false});
  const sol={};P.forEach(p=>p.cells.forEach(x=>sol[x.r+','+x.c]=x.ch));let cur=null,dir=0,first=null;
  let g='';for(let r=0;r<cw.rows;r++)for(let c=0;c<cw.cols;c++){const k=r+','+c;g+=sol[k]?'<div class="cc" data-k="'+k+'" style="grid-row:'+(r+1)+';grid-column:'+(c+1)+'">'+(nums[k]?'<sup>'+nums[k]+'</sup>':'')+'<input maxlength="2" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Rij '+(r+1)+', kolom '+(c+1)+'"></div>':''}
  const clue=d=>P.filter(p=>p.d===d).map(p=>'<button class="clue" data-p="'+P.indexOf(p)+'"><b>'+p.num+'.</b> '+esc(W[p.w.i].d)+' <span class="mute">('+p.w.L.length+')</span></button>').join('');
  app.innerHTML=head(title)+'<section class="card"><p class="mute">Tik op een vakje of een omschrijving. Tik opnieuw op een vakje om van richting te wisselen. Letters zonder accent of streepje.</p><div class="cw-wrap"><div class="cw" style="grid-template-columns:repeat('+cw.cols+',auto)">'+g+'</div></div><p class="row" style="margin-top:12px"><button class="btn" id="ck">Controleer</button><button class="btn sec" id="hint">Geef een letter</button><span id="msg" class="mute" aria-live="polite"></span></p><div class="clues"><div><h3>Horizontaal</h3>'+clue(0)+'</div><div><h3>Verticaal</h3>'+clue(1)+'</div></div></section>';
  const el=k=>$('.cc[data-k="'+k+'"]'),inp=k=>$('input',el(k));
  const wordAt=(k,d)=>P.find(p=>p.d===d&&p.cells.some(x=>x.r+','+x.c===k));
  const paint=()=>{$$('.cc').forEach(c=>c.classList.remove('hl','cur'));$$('.clue').forEach(c=>c.classList.remove('on'));if(!cur)return;const p=wordAt(cur,dir);if(p){p.cells.forEach(x=>el(x.r+','+x.c).classList.add('hl'));$('.clue[data-p="'+P.indexOf(p)+'"]').classList.add('on')}el(cur).classList.add('cur')};
  const focus=(k,d)=>{if(d!=null)dir=d;if(!wordAt(k,dir))dir=1-dir;cur=k;paint();const i=inp(k);if(document.activeElement!==i)i.focus()};
  const step=n=>{const p=wordAt(cur,dir);if(!p)return;const j=p.cells.findIndex(x=>x.r+','+x.c===cur)+n;if(j>=0&&j<p.cells.length)focus(p.cells[j].r+','+p.cells[j].c)};
  $$('.cc').forEach(c=>{const k=c.dataset.k,i=$('input',c);
    i.addEventListener('pointerdown',()=>{if(cur===k&&document.activeElement===i&&wordAt(k,1-dir)){dir=1-dir;paint()}});
    i.addEventListener('focus',()=>{if(cur!==k)focus(k)});
    i.addEventListener('input',()=>{const v=letters(i.value).slice(-1);i.value=v;c.classList.remove('good','wrong');if(v)step(1)});
    i.addEventListener('keydown',e=>{const [r,cc]=k.split(',').map(Number);const mv=(dr,dc,d)=>{e.preventDefault();const t=(r+dr)+','+(cc+dc);if(sol[t])focus(t,wordAt(t,d)?d:null);};
      if(e.key==='Backspace'){e.preventDefault();c.classList.remove('good','wrong');if(i.value)i.value='';else{step(-1);if(cur!==k){inp(cur).value='';el(cur).classList.remove('good','wrong')}}}
      else if(e.key==='ArrowRight')mv(0,1,0);else if(e.key==='ArrowLeft')mv(0,-1,0);else if(e.key==='ArrowDown')mv(1,0,1);else if(e.key==='ArrowUp')mv(-1,0,1);
      else if(e.key===' '){e.preventDefault();if(wordAt(k,1-dir)){dir=1-dir;paint()}}})});
  $('.clues').onclick=e=>{const b=e.target.closest('.clue');if(!b)return;const p=P[+b.dataset.p];const f=p.cells.find(x=>!inp(x.r+','+x.c).value)||p.cells[0];focus(f.r+','+f.c,p.d)};
  $('#hint').onclick=()=>{if(!cur){$('#msg').textContent='Kies eerst een vakje.';return}const i=inp(cur);i.value=sol[cur];P.forEach(p=>{if(p.cells.some(x=>x.r+','+x.c===cur))p.hint=true});$('#msg').textContent='Woorden met een hint tellen niet mee voor je score.';step(1)};
  $('#ck').onclick=()=>{if(first!=null){const bad=P.filter(p=>!p.okFirst).map(p=>p.w.i);return finish('cross',title,first,P.length,bad,{line:first+' van de '+P.length+' woorden juist bij de eerste controle'})}
    let good=0;P.forEach(p=>{const ok=p.cells.every(x=>inp(x.r+','+x.c).value===x.ch);p.okFirst=ok&&!p.hint;if(p.okFirst){good++;right(p.w.i)}else wrong(p.w.i);$('.clue[data-p="'+P.indexOf(p)+'"]').classList.toggle('good',ok)});
    Object.keys(sol).forEach(k=>{const v=inp(k).value;el(k).classList.toggle('good',v===sol[k]);el(k).classList.toggle('wrong',v!==sol[k])});
    first=good;$('#hint').remove();$('#msg').textContent=good+' van de '+P.length+' woorden juist. Rode vakjes zijn fout of leeg.';$('#ck').textContent='Bekijk resultaat →';
    const sh=document.createElement('button');sh.className='btn sec';sh.textContent='Toon oplossing';sh.onclick=()=>{Object.keys(sol).forEach(k=>{inp(k).value=sol[k];el(k).classList.remove('wrong')});sh.remove()};$('#ck').after(sh)};
  focus(P[0].r+','+P[0].c,P[0].d)}

/* ---------- toets ---------- */
function viewTestSetup(){app.innerHTML='<div class="bar"><button class="btn ghost" data-go="#/">← Alle groepen</button></div><h1>Toets</h1><p class="mute">Gemengde vragen over de groepen die je kiest. Je ziet pas op het einde wat juist en fout was. De resultaatkaart kun je afdrukken of als schermafbeelding indienen.</p>'+
  '<section class="card"><p><label for="tn"><b>Je naam</b></label><br><input class="gi wide" id="tn" maxlength="60" autocomplete="name" value="'+esc(S.name||'')+'"></p><p><b>Groepen</b> <button class="btn ghost" id="tall">alles aan/uit</button></p><div class="checks">'+GROUPS.map(g=>'<label><input type="checkbox" value="'+g+'"> Groep '+g+'</label>').join('')+'</div>'+
  '<p class="row"><label for="tq"><b>Aantal vragen</b></label><select id="tq"><option>10</option><option selected>20</option><option>30</option><option>40</option></select></p><p id="tm" class="mute" aria-live="polite"></p><p><button class="btn" id="tgo">Start de toets</button></p></section>';
  $('#tall').onclick=()=>{const cs=$$('.checks input'),on=!cs.every(c=>c.checked);cs.forEach(c=>c.checked=on)};
  $('#tgo').onclick=()=>{const gs=$$('.checks input').filter(c=>c.checked).map(c=>c.value);if(!gs.length){$('#tm').textContent='Kies minstens één groep.';return}S.name=$('#tn').value.trim();save();runTest(gs,+$('#tq').value)}}
function runTest(gs,n){const pool=W.filter(w=>gs.includes(w.g)).map(w=>w.i);const cyc=[qMc1,qMc2,qGapC,qTf,qType,qMc2,qMc1,qGapC,qTf,qType];const qs=sample(pool,Math.min(n,pool.length)).map((i,k)=>cyc[k%cyc.length](W[i],pool));
  const label=gs.length===GROUPS.length?'Alle groepen':'Groep '+gs.join(', ');cleanup=()=>{};
  runQuiz({title:'Toets · '+label,qs,defer:true,back:'#/toets',onDone:(score,log)=>{touchStreak();keyH=null;const pct=Math.round(score/qs.length*100),d=new Date();
    app.innerHTML='<section class="card res"><p class="lbl">Resultaatkaart · Academische woordenschat · 3de graad D/A · Rood</p><h1>'+esc(S.name||'(geen naam ingevuld)')+'</h1><p>'+label+' · '+d.toLocaleDateString('nl-BE',{day:'numeric',month:'long',year:'numeric'})+' om '+d.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'})+'</p><div class="ring" style="--p:'+pct+'"><div>'+pct+'%</div></div><h1>'+score+' / '+qs.length+'</h1>'+
    '<div class="row noprint" style="justify-content:center;margin-top:12px"><button class="btn" onclick="window.print()">Afdrukken</button><button class="btn sec" data-go="#/toets">Nieuwe toets</button><button class="btn sec" data-go="#/">Naar de groepen</button></div>'+
    '<table class="rev"><thead><tr><th></th><th>Vraag</th><th>Jouw antwoord</th><th>Juist antwoord</th></tr></thead><tbody>'+log.map(l=>{const q=l.q;const corr=q.type==='choice'?q.opts[q.correct]:q.answer;return '<tr><td style="color:var(--'+(l.ok?'ok':'bad')+')"><b>'+(l.ok?'✓':'✗')+'</b></td><td>'+q.rev+'</td><td>'+esc(l.given)+'</td><td>'+(l.ok?'':esc(corr))+'</td></tr>'}).join('')+'</tbody></table></section>'}})}

/* ---------- dagtraining (gespreide herhaling) ---------- */
const INT=[1,1,2,4,7,14,30],DAYMAX=15;
const dayNum=d=>Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const today=()=>dayNum(new Date());
const dueList=()=>Object.keys(S.box).map(Number).filter(i=>W[i]&&S.box[i].due<=today()).sort((a,b)=>S.box[a].due-S.box[b].due||S.box[a].b-S.box[b].b);
function dayLine(){const n=dueList().length;if(S.dayDone===dayStr(new Date()))return '✓ Vandaag voltooid. '+(n?n+' woorden staan nog klaar voor een extra ronde.':'Kom morgen terug.');return (n?Math.min(n,DAYMAX)+' woorden om te herhalen':'Start met nieuwe woorden')+' · een korte reeks die zich aanpast aan wat je al kent.'}
function dayStats(){const bs=Object.values(S.box);return{seen:bs.length,sure:bs.filter(b=>b.b>=5).length,due:dueList().length,lv:[1,2,3,4,5,6].map(l=>bs.filter(b=>Math.max(1,b.b)===l).length)}}
function viewDay(){CUR.key='DAY';const st=dayStats(),done=S.dayDone===dayStr(new Date());
  app.innerHTML='<div class="bar"><button class="btn ghost" data-go="#/">← Alle groepen</button></div><h1>📅 Dagtraining</h1><p class="mute">Elke dag een korte reeks van ongeveer '+DAYMAX+' vragen. Woorden die je goed kent, komen minder vaak terug; woorden waar je op struikelt, zie je snel opnieuw. Hoe beter je een woord kent, hoe moeilijker de vraag: eerst meerkeuze, daarna invullen en typen.</p>'+
  '<section class="card"><div class="daybox"><div><b>'+st.due+'</b>klaar om te herhalen</div><div><b>'+st.seen+'</b>woorden in training</div><div><b>'+st.sure+'</b>woorden beheerst</div></div>'+
  '<p class="lbl" style="margin-top:6px">Vakjes: van nieuw (1) naar beheerst (6)</p><div class="lv" aria-hidden="true">'+st.lv.map(n=>{const m=Math.max(1,...st.lv);return '<i style="background:linear-gradient(to top,var(--acc2) '+(n/m*100)+'%,var(--line) 0)" title="'+n+'"></i>'}).join('')+'</div><p class="mute" style="font-size:.85rem">'+st.lv.map((n,k)=>(k+1)+': '+n).join(' · ')+'</p>'+
  '<p class="row" style="margin-top:12px"><label for="dg"><b>Nieuwe woorden uit</b></label><select id="dg"><option value="">alle groepen, in volgorde</option>'+GROUPS.map(g=>'<option value="'+g+'"'+(S.dayG===g?' selected':'')+'>groep '+g+'</option>').join('')+'</select></p>'+
  (done?'<div class="fb ok"><h4>Vandaag voltooid ✓</h4>Je dagtraining zit erop. Een extra ronde mag altijd.</div>':'')+
  '<p style="margin-top:14px"><button class="btn" id="dgo">'+(done?'Extra ronde':'Start de dagtraining')+'</button></p></section>';
  $('#dg').onchange=e=>{S.dayG=e.target.value;save()};$('#dgo').onclick=runDay}
function runDay(){const due=dueList().slice(0,DAYMAX);const room=DAYMAX-due.length,newN=Math.min(room,due.length?6:10);
  const fresh=W.filter(w=>!S.box[w.i]&&(!S.dayG||w.g===S.dayG)).map(w=>w.i);const add=(S.dayG?shuffle(fresh):fresh).slice(0,newN);
  const list=shuffle(due.concat(add));
  if(!list.length){app.innerHTML=head('Dagtraining',0,0,'#/dag')+'<div class="card"><p>Er staan vandaag geen woorden klaar en '+(S.dayG?'groep '+S.dayG+' heeft':'er zijn')+' geen nieuwe woorden meer. Kies een andere groep voor nieuwe woorden of kom morgen terug.</p></div>';return}
  const make=i=>{const w=W[i],b=S.box[i]?S.box[i].b:0,pool=W.filter(x=>x.g===w.g).map(x=>x.i);
    const t=b<=1?[qMc1,qMc2]:b<=3?[qGapC,qMc2,qTf,qMc1]:[qGapT,qType,qGapT];return t[Math.random()*t.length|0](w,pool)};
  const qs=list.map(make);cleanup=()=>{};
  runQuiz({title:'Dagtraining',qs,back:'#/dag',onDone:(score,log)=>{const t=today();let up=0;
    log.forEach(l=>{const i=l.q.w.i,o=S.box[i]||{b:0};if(l.ok){const nb=Math.min(6,Math.max(1,o.b)+1);S.box[i]={b:nb,due:t+INT[nb]};up++}else S.box[i]={b:1,due:t+1}});
    S.dayDone=dayStr(new Date());save();
    finish('day','Dagtraining',score,qs.length,log.filter(l=>!l.ok).map(l=>l.q.w.i),{nosave:1,back:'#/dag',backT:'Naar de dagtraining',again:runDay,againT:'Extra ronde',
      msg:up+(up===1?' woord schuift':' woorden schuiven')+' een vakje op. Woorden die je fout had, komen morgen terug.'})}})}

setTheme();paintTop();route();
</script>
